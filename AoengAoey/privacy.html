    <!-- Theme attribute for every route, and on home only: start the hero poster (the LCP image) before the JS runs. Mirrors HeroStage.tsx posterSet()
         and ThemeProvider's theme rule (saved choice, else light 06:00-18:00). -->
    <script id="ev-hero-preload">
      (function () {
        try {
          var base = '/AoengAoey/';
          var t = null;
          try { t = localStorage.getItem('theme'); } catch (e) {}
          if (t !== 'light' && t !== 'dark') { var h = new Date().getHours(); t = h >= 6 && h < 18 ? 'light' : 'dark'; }
          document.documentElement.setAttribute('data-theme', t);
          var p = location.pathname;
          if (p !== base && p !== base + 'index.html' && p + '/' !== base) return;
          var wide = matchMedia('(min-width: 768px)').matches;
          var u = function (n) { return base + 'images/hero/counter-' + t + '-' + n + '.webp'; };
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.type = 'image/webp'; l.setAttribute('fetchpriority', 'high');
          l.setAttribute('imagesizes', '100vw');
          l.setAttribute('imagesrcset', wide ? u('1280') + ' 1280w, ' + u('1920') + ' 1920w' : u('phone-480') + ' 480w, ' + u('phone-768') + ' 768w');
          document.head.appendChild(l);
        } catch (e) {}
      })();
    </script>

    <style>
      /* Static copy of the home hero box (HomePage.tsx hero section + HeroStage poster), painted before any JS.
         It sits behind the app (z-index -1): React's hero covers it with the same poster in the same place,
         then HeroStage removes it. Nothing moves. */
      #ev-shell { position: absolute; top: 0; left: 0; right: 0; z-index: -1; pointer-events: none; }
      .ev-shell-hero { position: relative; overflow: hidden; height: min(56svh, 440px); min-height: 320px; background: linear-gradient(to bottom, #e3efe4, #f1eee2, #fbfaf3); }
      [data-theme="dark"] .ev-shell-hero { background: linear-gradient(to bottom, #0d0820, #191032, #26173f); }
      @media (min-width: 768px) { .ev-shell-hero { height: clamp(600px, calc(100svh - 4rem), 760px); min-height: 0; } }
      #ev-shell-img { position: absolute; inset: 0; width: 100%; height: 100%; -o-object-fit: cover; object-fit: cover; }
    </style>
    <script>
      (function () {
        var shell = document.getElementById('ev-shell');
        try {
          var base = '/AoengAoey/', p = location.pathname;
          if (p !== base && p !== base + 'index.html' && p + '/' !== base) { shell.remove(); return; }
          var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
          var wide = matchMedia('(min-width: 768px)').matches;
          var u = function (n) { return base + 'images/hero/counter-' + t + '-' + n + '.webp'; };
          var img = document.getElementById('ev-shell-img');
          img.sizes = '100vw';
          img.srcset = wide ? u('1280') + ' 1280w, ' + u('1920') + ' 1920w' : u('phone-480') + ' 480w, ' + u('phone-768') + ' 768w';
          img.src = wide ? u('1280') : u('phone-768');
        } catch (e) { shell && shell.remove(); }
      })();
    </script>
